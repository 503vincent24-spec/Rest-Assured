<svg viewBox="0 0 1050 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rest Assured Moving LLC referral card — front">
  <rect width="1050" height="600" fill="#FAFAF8"/>
  <rect x="0" y="0" width="1050" height="8" fill="#1F7A5C"/>
  <rect x="0" y="592" width="1050" height="8" fill="#1F7A5C"/>
  <!-- Shield mark -->
  <g transform="translate(60,140) scale(1.45)">
    <defs><linearGradient id="rfs" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#16335E"/><stop offset="100%" stop-color="#0F2547"/></linearGradient></defs>
    <path d="M100,10 L168,38 L168,104 C168,154 138,184 100,208 C62,184 32,154 32,104 L32,38 Z" fill="url(#rfs)" stroke="#D4D8D4" stroke-width="2.5"/>
    <path d="M66,100 L100,64 L134,100 Z" fill="#1F7A5C"/>
    <rect x="72" y="100" width="56" height="50" fill="#1F7A5C"/>
    <line x1="66" y1="100" x2="134" y2="100" stroke="#0F2547" stroke-width="2.5"/>
    <path d="M84,124 L96,139 L120,106" fill="none" stroke="#FAFAF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Headline text -->
  <text x="340" y="175" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#0F2547">Know someone</text>
  <text x="340" y="235" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#0F2547">who's moving?</text>
  <text x="340" y="290" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#4A5568">Pass this card along — they'll thank you.</text>
  <!-- Offer badge -->
  <rect x="338" y="330" width="460" height="62" rx="31" fill="none" stroke="#1F7A5C" stroke-width="2.5"/>
  <text x="568" y="370" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="700" fill="#0D6347" letter-spacing="1">$25 OFF — FOR BOTH OF YOU</text>
  <!-- Company name -->
  <text x="340" y="460" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#0F2547">Rest Assured Moving LLC</text>
  <text x="340" y="490" font-family="'Courier New',monospace" font-size="17" fill="#1F7A5C" letter-spacing="2">MOVING LABOR CO. · SALEM, OR</text>
  <!-- Tagline -->
  <text x="340" y="545" font-family="Georgia,serif" font-size="20" fill="#718096" font-style="italic">Rest assured, it's handled.</text>
</svg>
