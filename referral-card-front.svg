  <rect x="0" y="0" width="1050" height="10" fill="#1F7A5C"/>

  <text x="525" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#0F2547">Know someone moving?</text>

  <g transform="translate(390,180) scale(1.1)">
    <path d="M100,12 L166,38 L166,102 C166,150 138,182 100,206 C62,182 34,150 34,102 L34,38 Z"
